name: Build documentation
description: >-
  Sets up Python, installs the pinned docs toolchain from requirements.txt and runs
  `mkdocs build --strict`. Shared by pr.yaml (validation) and deploy-docs.yaml (Pages
  deploy) so the two builds cannot drift apart.

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        # A minor version, not '3.x', so a new CPython release cannot change the build unannounced.
        python-version: '3.12'

    - name: Install dependencies
      shell: bash
      run: pip install -r requirements.txt

    - name: Build documentation
      shell: bash
      run: mkdocs build --strict
